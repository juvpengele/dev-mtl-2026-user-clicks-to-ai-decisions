services:
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - ./jaeger/config-ui.json:/etc/jaeger/config-ui.json:ro
    ports:
      - "16686:16686"
    expose:
      - "4317"

  collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector.local.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
